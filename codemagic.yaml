workflows:
  react-native-expo-android:
    name: TN Happy Kids - Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - android_signing
        - google_oauth
    scripts:
      - name: Install dependencies
        script: |
          cd my-expo-app
          npm install
          npx expo install expo-build-properties expo-splash-screen
      - name: Expo Prebuild
        script: |
          cd my-expo-app
          npx expo prebuild --platform android
      - name: Build APK
        script: |
          cd my-expo-app/android
          ./gradlew assembleRelease
      - name: Build AAB
        script: |
          cd my-expo-app/android
          ./gradlew bundleRelease
      - name: Save keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
      - name: Sign APK with release key
        script: |
          apksigner sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:$CM_KEYSTORE_PASSWORD" \
            --ks-key-alias $CM_KEY_ALIAS \
            --key-pass "pass:$CM_KEY_PASSWORD" \
            my-expo-app/android/app/build/outputs/apk/release/app-release.apk
      - name: Sign AAB with release key
        script: |
          jarsigner \
            -keystore /tmp/keystore.jks \
            -storepass $CM_KEYSTORE_PASSWORD \
            -keypass $CM_KEY_PASSWORD \
            my-expo-app/android/app/build/outputs/bundle/release/app-release.aab \
            $CM_KEY_ALIAS
    artifacts:
      - my-expo-app/android/app/build/outputs/apk/release/*.apk
      - my-expo-app/android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - dineshwebdev2003@gmail.com
