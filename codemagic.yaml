workflows:
  react-native-expo-android:
    name: TN Happy Kids - Android Release AAB (1.1.4)
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
      cancel_previous_builds: false
    environment:
      node: latest
      vars:
        NODE_OPTIONS: "--max-old-space-size=6144"
      groups:
        - android_signing
    scripts:
      - name: Install & Build AAB
        script: |
          cd my-expo-app
          npm install
          npx expo install expo-build-properties expo-splash-screen expo-intent-launcher
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
          fi
          echo "$CM_KEYSTORE" | base64 -d > android_keystore.jks
          npx expo prebuild --platform android
          cd android
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('../../android_keystore.jks')
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          ./gradlew --max-workers=2 bundleRelease
    artifacts:
      - my-expo-app/android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - dineshwebdev2003@gmail.com
