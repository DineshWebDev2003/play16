workflows:
  react-native-expo-android:
    name: TN Happy Kids - Android Release AAB
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      vars:
        NODE_OPTIONS: "--max-old-space-size=6144"
      groups:
        - android_signing
    scripts:
      - name: Install dependencies
        script: |
          cd my-expo-app
          npm install
          npx expo install expo-build-properties expo-splash-screen
      - name: Decode google-services.json
        script: |
          cd my-expo-app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
          fi
      - name: Place release keystore
        script: |
          cd my-expo-app
          echo "$CM_KEYSTORE" | base64 -d > android_keystore.jks
      - name: Expo Prebuild
        script: |
          cd my-expo-app
          npx expo prebuild --platform android
      - name: Wire release signing config
        script: |
          cd my-expo-app/android
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('../../android_keystore.jks')
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Build Release AAB + APK
        script: |
          cd my-expo-app
          export NODE_OPTIONS="--max-old-space-size=6144"
          cd android
          ./gradlew --max-workers=2 bundleRelease assembleRelease
    artifacts:
      - my-expo-app/android/app/build/outputs/bundle/release/*.aab
      - my-expo-app/android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - dineshwebdev2003@gmail.com