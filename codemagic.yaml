workflows:
  react-native-expo-android:
    name: TN Happy Kids - Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          cd my-expo-app
          npm install
          npx expo install expo-build-properties expo-splash-screen
      - name: Expo Prebuild
        script: |
          cd my-expo-app
          npx expo prebuild --platform android
      - name: Configure release signing
        script: |
          cd my-expo-app
          chmod +x scripts/configure-signing.sh
          ./scripts/configure-signing.sh
      - name: Print SHA-1 fingerprint
        script: |
          keytool -list -v -keystore /tmp/keystore.keystore -alias "$CM_KEY_ALIAS" -storepass "$CM_KEYSTORE_PASSWORD" -keypass "$CM_KEY_PASSWORD" 2>&1 | grep -A 1 "SHA1:"
      - name: Build Signed Release APK
        script: |
          cd my-expo-app/android
          ./gradlew assembleRelease
      - name: Build Signed Release AAB
        script: |
          cd my-expo-app/android
          ./gradlew bundleRelease
    artifacts:
      - my-expo-app/android/app/build/outputs/apk/release/*.apk
      - my-expo-app/android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - dineshwebdev2003@gmail.com
