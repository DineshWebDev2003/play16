workflows:
  react-native-expo-android:
    name: TN Happy Kids - Android Builds
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - android_signing
        - google_oauth
    scripts:
      - name: Install dependencies
        script: |
          cd my-expo-app
          npm install
          npx expo install expo-build-properties expo-splash-screen
      - name: Expo Prebuild
        script: |
          cd my-expo-app
          npx expo prebuild --platform android
      - name: Setup release signing
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
      - name: Patch build.gradle for release signing
        script: |
          python3 my-expo-app/scripts/patch_build.py
      - name: Build Debug APK
        script: |
          cd my-expo-app/android
          ./gradlew assembleDebug
      - name: Build Release AAB
        script: |
          export KEYSTORE_PATH=/tmp/keystore.jks
          export CM_KEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          export CM_KEY_ALIAS=$CM_KEY_ALIAS
          export CM_KEY_PASSWORD=$CM_KEY_PASSWORD
          cd my-expo-app/android
          ./gradlew bundleRelease
      - name: Verify AAB fingerprint
        script: |
          apksigner verify --print-certs \
            my-expo-app/android/app/build/outputs/bundle/release/app-release.aab
    artifacts:
      - my-expo-app/android/app/build/outputs/apk/debug/*.apk
      - my-expo-app/android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - dineshwebdev2003@gmail.com
