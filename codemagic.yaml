workflows:
  react-native-expo-android:
    name: TN Happy Kids - Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          cd my-expo-app
          npm install
          npx expo install expo-build-properties expo-splash-screen
      - name: Expo Prebuild
        script: |
          cd my-expo-app
          npx expo prebuild --platform android
      - name: Configure release signing
        script: |
          cd my-expo-app
          chmod +x scripts/configure-signing.sh
          ./scripts/configure-signing.sh
      - name: Build Signed Release APK
        script: |
          cd my-expo-app/android
          ./gradlew assembleRelease
      - name: Build Signed Release AAB
        script: |
          cd my-expo-app/android
          ./gradlew bundleRelease
      - name: Print SHA-1 fingerprint
        script: |
          APK=$(ls my-expo-app/android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "APK: $APK"
            apksigner verify --print-certs "$APK" 2>&1
          else
            echo "No APK found at expected path"
          fi
    artifacts:
      - my-expo-app/android/app/build/outputs/apk/release/*.apk
      - my-expo-app/android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - dineshwebdev2003@gmail.com
