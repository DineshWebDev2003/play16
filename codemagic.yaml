workflows:
  react-native-expo-android:
    name: TN Happy Kids - Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - android_signing
        - google_oauth
    scripts:
      - name: Install dependencies
        script: |
          cd my-expo-app
          npm install
          npx expo install expo-build-properties expo-splash-screen
      - name: Expo Prebuild
        script: |
          cd my-expo-app
          npx expo prebuild --platform android
      - name: Setup release signing
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
      - name: Patch build.gradle for release signing
        script: |
          cat > /tmp/patch_build.py << 'PYEOF'
with open("my-expo-app/android/app/build.gradle", "r") as f:
    content = f.read()
content = content.replace(
    '        }\n    }\n    buildTypes {',
    '        }\n        release {\n            storeFile file(System.getenv("KEYSTORE_PATH") ?: "/tmp/keystore.jks")\n            storePassword System.getenv("CM_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("CM_KEY_ALIAS")\n            keyPassword System.getenv("CM_KEY_PASSWORD")\n        }\n    }\n    buildTypes {'
)
content = content.replace(
    '        release {\n            // Caution! In production, you need to generate your own keystore file.\n            // see https://reactnative.dev/docs/signed-apk-android.\n            signingConfig signingConfigs.debug',
    '        release {\n            signingConfig signingConfigs.release'
)
with open("my-expo-app/android/app/build.gradle", "w") as f:
    f.write(content)
print("build.gradle patched successfully")
PYEOF
          python3 /tmp/patch_build.py
      - name: Build Release APK
        script: |
          export KEYSTORE_PATH=/tmp/keystore.jks
          export CM_KEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          export CM_KEY_ALIAS=$CM_KEY_ALIAS
          export CM_KEY_PASSWORD=$CM_KEY_PASSWORD
          cd my-expo-app/android
          ./gradlew assembleRelease
      - name: Verify APK fingerprint
        script: |
          apksigner verify --print-certs \
            my-expo-app/android/app/build/outputs/apk/release/app-release.apk
    artifacts:
      - my-expo-app/android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - dineshwebdev2003@gmail.com
